plugins { id 'java'; id 'net.minecraftforge.gradle' version '6.0.54' }
version = '0.2'

// Server acceptance must not resolve client-only shader mods onto its shared runtime.
if (project.hasProperty('myriadExternalShaders') && gradle.startParameter.taskNames.any {
    it.tokenize(':').last() in ['verifyFull', 'runGameTestServer']
}) {
    throw new GradleException('Run verifyFull without myriadExternalShaders; validate external shaders in a separate runClient invocation.')
}

group = 'cn.blockforge.generated.generatedmod'
base { archivesName = 'myriad-ascension' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Opt-in integration captures; pointer protection and fixtures stay out of release artifacts.
if (project.hasProperty('myriadCapture')) {
    if (project.hasProperty('talismanUserStack')) {
        repositories { flatDir { dirs project.file('build/talisman-test-libs') } }
        dependencies {
            runtimeOnly fg.deobf('talisman-test:oculus-mc1.20.1:1.8.0')
            runtimeOnly fg.deobf('talisman-test:embeddium:0.3.31+mc1.20.1')
            runtimeOnly fg.deobf('talisman-test:jei-1.20.1-forge:15.74.0.225')
        }
    }

    if (project.hasProperty('myriadExternalShaders')) {
        repositories { flatDir { dirs project.file('build/meteor-client/mod-libs') } }
        dependencies {
            runtimeOnly fg.deobf('meteor-test:oculus-mc1.20.1:1.8.0')
            runtimeOnly fg.deobf('meteor-test:embeddium:0.3.31+mc1.20.1')
        }
    }
    sourceSets {
        myriadClientTest {
            java.setSrcDirs(['src/myriadclienttest/java'])
            if (!project.hasProperty('jeiLayoutCapture')) java.exclude('**/JeiLayoutCapture.java')
            resources.setSrcDirs(['src/myriadclienttest/resources'])
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
        }
    }
    minecraft.runs {
        client {
            workingDirectory project.file('build/myriad-client')
            jvmArgs '-Xmx2G', '-XX:ActiveProcessorCount=4', '-XX:CICompilerCount=2'
            args '--mixin', 'wuxingxiantu.myriad-qa-pointer.mixins.json'
            property 'wuxingxiantu.myriadCapture', (!project.hasProperty('myriadWorldgen') && !project.hasProperty('myriadUiOnly') && !project.hasProperty('creativeTabsCapture')).toString()
            if (project.hasProperty('creativeTabsCapture')) property 'wuxingxiantu.creativeTabsCapture', 'true'
            if (project.hasProperty('inscriptionCapture')) { property 'wuxingxiantu.inscriptionCapture', 'true'; property 'wuxingxiantu.myriadCapture', 'false' }
            if (project.hasProperty('talismanCapture')) { property 'wuxingxiantu.talismanCapture', 'true'; property 'wuxingxiantu.myriadCapture', 'false' }
            if (project.hasProperty('reforgeCapture')) { property 'wuxingxiantu.reforgeCapture', 'true'; property 'wuxingxiantu.myriadCapture', 'false' }
            if (project.hasProperty('senseHeavenlyCapture')) { property 'wuxingxiantu.senseHeavenlyCapture', 'true'; property 'wuxingxiantu.myriadCapture', 'false' }
            if (project.hasProperty('senseEffectsCapture')) { property 'wuxingxiantu.senseEffectsCapture', 'true'; property 'wuxingxiantu.myriadCapture', 'false' }
            if (project.hasProperty('thunderDomainCapture')) { property 'wuxingxiantu.thunderDomainCapture', 'true'; property 'wuxingxiantu.myriadCapture', 'false' }
            if (project.hasProperty('jeiLayoutCapture')) property 'wuxingxiantu.jeiLayoutCapture', 'true'
            if (project.hasProperty('backpackLayoutCapture')) { property 'wuxingxiantu.backpackLayoutCapture', 'true'; property 'wuxingxiantu.myriadCapture', 'false' }
            if (project.hasProperty('backpackCaptureOutput')) property 'wuxingxiantu.backpackCaptureOutput', project.file(project.property('backpackCaptureOutput')).absolutePath
            if (project.hasProperty('backpackExpectShaders')) property 'wuxingxiantu.backpackExpectShaders', 'true'
            if (project.hasProperty('swordTailCapture')) { property 'wuxingxiantu.swordTailCapture', 'true'; property 'wuxingxiantu.myriadCapture', 'false' }
            if (project.hasProperty('swordTailOutput')) property 'wuxingxiantu.swordTailOutput', project.file(project.property('swordTailOutput')).absolutePath
            if (project.hasProperty('huahongSkins')) property 'wuxingxiantu.huahongSkins', 'true'
            if (project.hasProperty('huahongCapture')) {
                property 'wuxingxiantu.huahongCapture', 'true'
                property 'wuxingxiantu.myriadCapture', 'false'
                property 'wuxingxiantu.huahongOutput', project.file(project.findProperty('huahongOutput') ?: 'reports/huahong-client').absolutePath
            }
            if (project.hasProperty('myriadWorldgen')) property 'wuxingxiantu.myriadWorldgen', 'true'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', file('build/createSrgToMcp/output.srg').absolutePath
            if (project.hasProperty('myriadNativePath')) property 'org.lwjgl.librarypath', project.property('myriadNativePath')
            if (project.hasProperty('myriadCaptureOutput')) property 'wuxingxiantu.myriadCaptureOutput', project.property('myriadCaptureOutput')
            if (project.hasProperty('myriadExternalShaders')) property 'wuxingxiantu.myriadExternalShaders', 'true'
            if (project.hasProperty('myriadExpectedShaderPack')) property 'wuxingxiantu.myriadExpectedShaderPack', project.property('myriadExpectedShaderPack')
            mods { wuxingxiantu { source sourceSets.main; source sourceSets.myriadClientTest } }
        }
    }
}

// Opt-in real small-world star-ceiling compatibility fixture; never bundled in releases.
if (project.hasProperty('heavenlySmallWorld')) {
    repositories { flatDir { dirs project.file('build/creation-compat-libs') } }
    dependencies { runtimeOnly fg.deobf('creation-test:wuxingchuangshi:1.0') }
}

// Optional compatibility fixture; never a production dependency or bundled mod.
if (project.hasProperty('infuserCompatibility')) {
    repositories { flatDir { dirs project.file('build/infuser-compat-libs') } }
    dependencies {
        runtimeOnly fg.deobf('infuser-test:enchanting-infuser:8.0.3')
        runtimeOnly fg.deobf('infuser-test:puzzleslib:8.1.33')
    }
}

// Real domain selection hover rendering with live server attributes, isolated save.
if (project.hasProperty('domainUiCapture') || project.hasProperty('alchemyReservationCapture')) {
    if (project.hasProperty('domainUiExternalShaders')) {
        repositories { flatDir { dirs project.file('build/meteor-client/mod-libs') } }
        dependencies {
            runtimeOnly fg.deobf('meteor-test:oculus-mc1.20.1:1.8.0')
            runtimeOnly fg.deobf('meteor-test:embeddium:0.3.31+mc1.20.1')
        }
    }
    sourceSets {
        domainClientTest {
            java.setSrcDirs(['src/domainclienttest/java'])
            if (!project.hasProperty('jeiCapture')) java.exclude('**/JeiCatalogCapture.java')
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
        }
    }
    minecraft.runs {
        client {
            workingDirectory project.file(project.hasProperty('alchemyReservationCapture') ? 'build/alchemy-reservation-client' : 'build/domain-ui-client')
            property 'wuxingxiantu.domainUiCapture', 'true'
            property 'wuxingxiantu.jeiCatalogCapture', project.hasProperty('jeiCapture').toString()
            if (project.hasProperty('jeiOutput')) property 'wuxingxiantu.jeiOutput', project.property('jeiOutput')
            property 'wuxingxiantu.alchemyReservationCapture', project.hasProperty('alchemyReservationCapture').toString()
            property 'wuxingxiantu.anvilUiCapture', project.hasProperty('anvilUiCapture').toString()
            property 'wuxingxiantu.detailsUiCapture', project.hasProperty('detailsUiCapture').toString()
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', file('build/createSrgToMcp/output.srg').absolutePath
            jvmArgs '-Xmx2G', '-XX:ActiveProcessorCount=4', '-XX:CICompilerCount=2'
            mods { wuxingxiantu { source sourceSets.main; source sourceSets.domainClientTest } }
        }
    }
}

// Actual server-controlled sword movement and restored client trail preference.
if (project.hasProperty('swordTrailCapture')) {
    sourceSets {
        swordTrailClientTest {
            java.setSrcDirs(['src/swordtrailclienttest/java'])
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
        }
    }
    minecraft.runs {
        client {
            workingDirectory project.file('build/sword-trail-client')
            property 'wuxingxiantu.swordTrailCapture', 'true'
            if (project.hasProperty('swordTrailShowWindow')) property 'wuxingxiantu.swordTrailShowWindow', 'true'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', file('build/createSrgToMcp/output.srg').absolutePath
            jvmArgs '-Xmx2G', '-XX:ActiveProcessorCount=4', '-XX:CICompilerCount=2'
            mods { wuxingxiantu { source sourceSets.main; source sourceSets.swordTrailClientTest } }
        }
    }
}

// Opt-in real client screenshots for the five active sword technique silhouettes; never bundled.
if (project.hasProperty('swordTechniqueCapture')) {
    sourceSets {
        swordTechniqueClientTest {
            java.setSrcDirs(['src/swordtechniqueclienttest/java'])
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
        }
    }
    minecraft.runs {
        client {
            workingDirectory project.file('build/sword-technique-client')
            property 'wuxingxiantu.swordTechniqueCapture', 'true'
            property 'wuxingxiantu.swordTechniqueOutput', project.findProperty('swordTechniqueOutput') ?: '../../reports/sword-technique-client'
            if (project.hasProperty('swordTechniqueShowWindow')) property 'wuxingxiantu.swordTechniqueShowWindow', 'true'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', file('build/createSrgToMcp/output.srg').absolutePath
            jvmArgs '-Xmx2G', '-XX:ActiveProcessorCount=4', '-XX:CICompilerCount=2'
            mods { wuxingxiantu { source sourceSets.main; source sourceSets.swordTechniqueClientTest } }
        }
    }
}

// Server-triggered shield fracture acceptance, isolated from launcher saves.
if (project.hasProperty('shieldShatterCapture')) {
    sourceSets {
        shieldShatterClientTest {
            java.setSrcDirs(['src/shatterclienttest/java'])
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
        }
    }
    minecraft.runs {
        client {
            workingDirectory project.file('build/shield-shatter-client')
            property 'wuxingxiantu.shieldShatterCapture', 'true'
            if (project.hasProperty('shieldShatterShowWindow')) property 'wuxingxiantu.shieldShatterShowWindow', 'true'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', file('build/createSrgToMcp/output.srg').absolutePath
            jvmArgs '-Xmx2G', '-XX:ActiveProcessorCount=4', '-XX:CICompilerCount=2'
            mods { wuxingxiantu { source sourceSets.main; source sourceSets.shieldShatterClientTest } }
        }
    }
}

// Equipment-glint GPU/packet acceptance runs in its own disposable client save.
// This source set is opt-in and never packaged in the production JAR.
if (project.hasProperty('guardGlintCapture')) {
    if (project.hasProperty('guardExternalShaders')) {
        repositories { flatDir { dirs project.file('build/meteor-client/mod-libs') } }
        dependencies {
            runtimeOnly fg.deobf('meteor-test:oculus-mc1.20.1:1.8.0')
            runtimeOnly fg.deobf('meteor-test:embeddium:0.3.31+mc1.20.1')
        }
    }
    sourceSets {
        cloudGlyphClientTest {
            java.setSrcDirs(['src/cloudglyphclienttest/java'])
            resources.setSrcDirs(['src/cloudglyphclienttest/resources'])
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
        }
    }
    minecraft.runs {
        client {
            workingDirectory project.file('build/cloud-glyph-client')
            args '--mixin', 'wuxingxiantu.qa-pointer.mixins.json'
            property 'wuxingxiantu.guardGlintCapture', 'true'
            property 'wuxingxiantu.talismanCapture', project.hasProperty('talismanCapture').toString()
            property 'wuxingxiantu.lookbackCapture', project.hasProperty('lookbackCapture').toString()
            property 'wuxingxiantu.firecoilCapture', project.hasProperty('firecoilCapture').toString()
            property 'wuxingxiantu.cloudOnlyCapture', project.hasProperty('cloudOnlyCapture').toString()
            property 'wuxingxiantu.furnaceOnlyCapture', project.hasProperty('furnaceOnlyCapture').toString()
            if (project.hasProperty('furnaceUpperCapture')) {
                property 'wuxingxiantu.furnaceUpperCapture', 'true'
                property 'wuxingxiantu.guardGlintOutput', project.hasProperty('guardExternalShaders')?'../../reports/furnace-upper-20261014/solas':'../../reports/furnace-upper-20261014/native'
                if (project.hasProperty('furnaceUpperNear')) {
                    property 'wuxingxiantu.furnaceNearCapture', 'true'
                    property 'wuxingxiantu.guardGlintOutput', project.hasProperty('guardExternalShaders')?'../../reports/furnace-upper-20261014/solas-near':'../../reports/furnace-upper-20261014/native-near'
                }
            }
            if (project.hasProperty('furnaceDensityCapture')) {
                property 'wuxingxiantu.guardGlintOutput', project.hasProperty('guardExternalShaders')?'../../reports/furnace-density-20261014/solas':'../../reports/furnace-density-20261014/native'
                property 'wuxingxiantu.furnaceDensityCapture', 'true'
            }
            if (project.hasProperty('furnaceNearPerformance')) {
                property 'wuxingxiantu.furnaceNearCapture', 'true'
                property 'wuxingxiantu.perfBaselineShader', project.file('reports/furnace-near-performance-20261014/baseline.fsh').absolutePath
                property 'wuxingxiantu.perfBaselineCorners', 'true'
                property 'wuxingxiantu.perfBaselineNoise', 'true'
                property 'wuxingxiantu.perfVisibleErrorLimit', '0.00392156862745098'
                property 'wuxingxiantu.guardGlintOutput', project.hasProperty('guardExternalShaders')?'../../reports/furnace-near-performance-20261014/solas':'../../reports/furnace-near-performance-20261014/native'
                property 'wuxingxiantu.perfOutput', project.hasProperty('guardExternalShaders')?'../../reports/furnace-near-performance-20261014/solas':'../../reports/furnace-near-performance-20261014/native'
                if (project.hasProperty('furnaceDensityCapture')) {
                    property 'wuxingxiantu.perfBaselineShader', project.file('reports/furnace-density-20261014/reference.fsh').absolutePath
                    property 'wuxingxiantu.verifyFireBed', 'true'
                    property 'wuxingxiantu.guardGlintOutput', project.hasProperty('guardExternalShaders')?'../../reports/furnace-density-20261014/solas-near':'../../reports/furnace-density-20261014/native-near'
                    property 'wuxingxiantu.perfOutput', project.hasProperty('guardExternalShaders')?'../../reports/furnace-density-20261014/solas-near':'../../reports/furnace-density-20261014/native-near'
                }
            }
            if (project.hasProperty('guardTierCapture')) {
                property 'wuxingxiantu.guardTierCapture', 'true'
                property 'wuxingxiantu.guardGlintOutput', '../../reports/guard-tier-client'
            }
            if (project.hasProperty('staticFixCapture')) {
                property 'wuxingxiantu.staticFixCapture', 'true'
                property 'wuxingxiantu.guardGlintOutput', '../../reports/static-fixes-20261015/client'
            }
            if (project.hasProperty('furnaceWarningCapture')) {
                property 'wuxingxiantu.furnaceWarningCapture', 'true'
                property 'wuxingxiantu.guardGlintOutput', project.findProperty('warningOutput') ?: '../../reports/dragon-warning-20261015/client'
            }
            if (project.hasProperty('guardGlintShowWindow')) property 'wuxingxiantu.guardGlintShowWindow', 'true'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', file('build/createSrgToMcp/output.srg').absolutePath
            jvmArgs '-Xmx2G', '-XX:ActiveProcessorCount=4', '-XX:CICompilerCount=2'
            mods { wuxingxiantu { source sourceSets.main; source sourceSets.cloudGlyphClientTest } }
        }
    }
}

// Opt-in real projectile contacts and GPU captures; excluded from the production jar.
if (project.hasProperty('shieldImpactCapture') || project.hasProperty('anvilSizeCapture') || project.hasProperty('guardImpactCapture')) {
    sourceSets {
        shieldClientTest {
            java.setSrcDirs(['src/shieldclienttest/java'])
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
        }
    }
    minecraft.runs {
        client {
            workingDirectory project.file('build/shield-impact-client')
            if (project.hasProperty('anvilSizeCapture')) property 'wuxingxiantu.anvilSizeCapture', 'true'
        if (project.hasProperty('guardImpactCapture')) property 'wuxingxiantu.guardImpactCapture', 'true'
            jvmArgs '-XX:ActiveProcessorCount=4', '-XX:CICompilerCount=2'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', file('build/createSrgToMcp/output.srg').absolutePath
            mods { wuxingxiantu { source sourceSets.main; source sourceSets.shieldClientTest } }
        }
    }
}

// Opt-in real GPU verification in a fresh isolated save.
if (project.hasProperty('tribulationCapture')) {
    sourceSets {
        tribulationClientTest {
            java.setSrcDirs(['src/tribulationclienttest/java'])
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
        }
    }
    minecraft.runs {
        client {
            workingDirectory project.file('build/tribulation-client')
            jvmArgs '-XX:ActiveProcessorCount=4', '-XX:CICompilerCount=2'
            property 'wuxingxiantu.tribulationCapture', 'true'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', file('build/createSrgToMcp/output.srg').absolutePath
            mods { wuxingxiantu { source sourceSets.main; source sourceSets.tribulationClientTest } }
        }
    }
}
minecraft {
    mappings channel: 'official', version: '1.20.1'
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
}
repositories {
    flatDir { dirs 'libs' }
    maven {
        url = 'https://maven.blamejared.com'
        content { includeGroup 'mezz.jei' }
    }
    maven {
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup 'software.bernie.geckolib' }
    }
}
dependencies {
    compileOnly fg.deobf('mezz.jei:jei-1.20.1-forge:15.59.0.212')
    if ((project.hasProperty('jeiCapture') || project.hasProperty('jeiLayoutCapture')) && !project.hasProperty('talismanUserStack')) runtimeOnly fg.deobf('mezz.jei:jei-1.20.1-forge:15.59.0.212')
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-1.20.1:${geckolib_version}")
}

// The durability hook is active in both development validation and the shipped Forge jar.
minecraft.runs.configureEach { args '--mixin', 'wuxingxiantu.forging.mixins.json' }
tasks.named('jar', Jar).configure { manifest.attributes('MixinConfigs':'wuxingxiantu.forging.mixins.json') }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
// src/main/java/software/bernie 下是按 GeckoLib 4.8.4 真实签名抄录的编译期类型桩，
// 仅供平台离线类型检查器使用；真实构建一律使用下面 fg.deobf 解析到的正版 GeckoLib，
// 因此这里把桩目录排除出编译源集，成品 jar 不会包含这些桩类。
sourceSets.main.java {
    exclude 'software/bernie/**'
    exclude 'software/bernie/geckolib/**'
}
processResources {
    def props = [mod_id: 'wuxingxiantu', mod_name: '万界仙途 · Myriad Ascension', mod_version: project.version, version: project.version,
                 minecraft_version: '1.20.1', forge_version: '47.4.10', geckolib_version_range: geckolib_version_range]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('META-INF/mods.toml') { expand props }
}
jar.finalizedBy('reobfJar')

// Use -PpythonExecutable=/path/to/python when Python is not on PATH.
tasks.register('validateResources', Exec) {
    def python = providers.gradleProperty('pythonExecutable').orElse('python')
    commandLine python.get(), file('tools/check_resources.py').absolutePath
    inputs.dir('src/main/resources')
    inputs.file('tools/check_resources.py')
}
tasks.named('check') { dependsOn('validateResources') }

def specialistScripts = ['check_talisman_frame', 'check_weapon_flames', 'check_heart_sword_assets', 'check_source_package', 'check_alchemy_art', 'check_exotic_burn_architecture', 'check_audit_contracts', 'check_entry_ui', 'check_boss_motions', 'check_art_particle_library']
specialistScripts.each { script ->
    tasks.register(script, Exec) {
        commandLine providers.gradleProperty('pythonExecutable').orElse('python').get(), file("tools/${script}.py").absolutePath
        inputs.dir('src/main')
        inputs.dir('source-assets')
        inputs.dir('reference_assets')
        inputs.file("tools/${script}.py")
    }
}
tasks.register('specialistChecks') { dependsOn(specialistScripts) }
tasks.named('check') { dependsOn('check_talisman_frame') }
tasks.named('check') { dependsOn('specialistChecks') }

sourceSets {
    gameTest {
        java.setSrcDirs(['src/gametest/java'])
        resources.setSrcDirs(['src/gametest/resources'])
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    regression {
        java.srcDir 'src/regression/java'
        compileClasspath = sourceSets.main.output
        runtimeClasspath = output + compileClasspath
    }
}
tasks.register('regressionTest', JavaExec) {
    dependsOn tasks.named('regressionClasses')
    classpath = sourceSets.regression.runtimeClasspath
    mainClass = 'cn.blockforge.generated.generatedmod.BalanceRegression'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
}
tasks.named('check') { dependsOn('regressionTest') }
tasks.register('balanceReport', JavaExec) {
    dependsOn tasks.named('regressionClasses')
    classpath = sourceSets.regression.output + sourceSets.main.runtimeClasspath
    mainClass = 'cn.blockforge.generated.generatedmod.BalanceReport'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    args file('reports/balance').absolutePath
}
tasks.named('check') { dependsOn('balanceReport') }
// Compile test fixtures in ordinary builds; the full server run is explicitly opt-in.
tasks.named('check') { dependsOn('compileGameTestJava') }
tasks.register('verifyFull') {
    group = 'verification'
    description = 'Build, compile all GameTests and execute the Forge GameTest server.'
    dependsOn('build', 'runGameTestServer')
}
tasks.matching { it.name == 'runGameTestServer' }.configureEach { mustRunAfter('build') }

minecraft.runs {
    gameTestServer {
            if (project.hasProperty('infuserCompatibility')) {
                property 'mixin.env.remapRefMap', 'true'
                property 'mixin.env.refMapRemappingFile', file('build/createSrgToMcp/output.srg').absolutePath
            }
            workingDirectory project.file(project.hasProperty('alchemyMigrationOnly') ? 'build/alchemy-migration-gametest' : project.hasProperty('v5DawnOnly') ? 'build/v5-dawn-gametest' : project.hasProperty('carvingOnly') ? 'build/carving-gametest' : project.hasProperty('fireTargetingOnly') ? 'build/fire-targeting-gametest' : project.hasProperty('domainDamageOnly') ? 'build/domain-damage-gametest' : project.hasProperty('spiritShieldOnly') ? 'build/shield-shatter-gametest' : project.hasProperty('xuanlingAnvilOnly') ? 'build/xuanling-anvil-gametest' : project.hasProperty('realmFlightOnly') ? 'build/realm-flight-gametest' :
                (project.hasProperty('entryUiOnly') ? 'build/entry-ui-gametest' : 'build/gametest-run'))
